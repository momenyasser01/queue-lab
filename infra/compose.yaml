name: queue-lab

services:
  postgres:
    profiles: [core]
    image: postgres:17
    environment:
      POSTGRES_USER: queuelab
      POSTGRES_PASSWORD: queuelab
      POSTGRES_DB: queuelab
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U queuelab']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: [core]
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
